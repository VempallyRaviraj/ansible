- name: install packages 
  hosts: local
  connection: local
  become : true
  vars:
    packages:
    -  { name : "git", state : "absent" }
    - { name : "nginx", state : "present" }
    - { name : "mysql", state : "absent" }
  tasks:
  - name: install the packages
    package:
      name: "{{ item .name}}"
      state: "{{ item.state }}"
    loop: "{{ packages }}"