- name : demo on fliters
  hosts: local
  connection: local
  vars:
    topics: "ansible, devops, linux, shell"
    names:
      - RAVI
      - RAJ
      - VEMPALLY
    topic : ANSIBLE
  tasks:
  - name : print the message
    debug:
      msg: "{{ person_name | default('Ramesh') }}"

  - name : convert the string to list
    debug:
      msg: "topics are:{{ topics | split(',') }}"

  - name : convert the list to string
    debug:
      msg: "fullname : {{ names | join }}"

  - name : CONVERT TO LOWERCASE
    debug:
      msg: "{{ topic| lower}}"