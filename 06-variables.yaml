- name: demo on task level variables
  hosts: local
  connection: local
  vars:
    property: "100acres"
  tasks:
  - name: print the sentence using variables
    debug:
      msg: "hi,i got {{ property }} of land"

  - name: print the vars again
    vars:
      property: "20 acres"
    debug:
      msg: "hi,i got {{ property }} of land"  