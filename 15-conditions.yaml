- name: print os is redhat or not
  hosts: local
  connection: local
  become: true
  tasks:
  - name: install the nginx
    dnf:
      state: present
    when : ansible_facts['os_family'] == "RedHat"

  - name: install nginx in debian
    apt:
      state: present
      name: nginx
    when : ansible_facts['os_family'] == "Debian"