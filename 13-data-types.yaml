- name: course information
  hosts: local
  connection: local
  vars:
    course: "AIOPS with devsecops on aAWS" #string
    duration_in_hrs: 150 #number
    is_live_session: true #boolean
    topics: #list
      - Linux
      - shell
      - ansible
      - terraform
    more_details: #dictionary
      trainer: "Sivakumar Reddy"
      months: 4
    exact_duration: 4.5 #float
  tasks:
  - name: print info and type
    debug:
      msg: |
        name: "{{ course }} : {{ course | type_debug }}"
        duration: "{{ duration_in_hrs }} : {{ duration_in_hrs | type_debug }}"
        is_live_session: "{{ is_live_session }} : {{ is_live_session | type_debug }}"
        topics: "{{ topics }} : {{ topics | type_debug }}"
        more_details: "{{ more_details }} : {{ more_details | type_debug }}"
        exact_duration: "{{ exact_duration }} : {{ exact_duration | type_debug }}"