- name: shellvscommand
  hosts: local
  connection: local
  tasks:
  - name: test the command module
    #command: cat /etc/passwd | grep ec2-user
    #this commented comment will not work because in command module there should be | pipe
    shell: cat /etc/passwd | grep ec2-user
    register: ec2_user_ouput

  - name: print the output
    debug:
      msg: "{{ ec2_user_ouput }}
  

  - name: get the files
    #command: ls-la > /tmp/files.txt
    shell: ls -la > /tmp/files.txt
    register: files_output

  - name: print the output again
    debug: 
      msg: "{{ files_output }}"